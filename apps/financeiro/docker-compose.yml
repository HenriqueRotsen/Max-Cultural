services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: salink
      POSTGRES_PASSWORD: salink
      POSTGRES_DB: salink
    ports:
      - "5433:5432"
    volumes:
      - salink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salink -d salink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salink_pg:
