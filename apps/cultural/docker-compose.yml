services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: max_cultural
    ports:
      - "5436:5432"
    volumes:
      - max_cultural_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d max_cultural"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  max_cultural_pg:
