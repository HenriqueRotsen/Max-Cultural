name: Security

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: node scripts/ci-audit-gate.mjs
      - name: ESLint Cultural
        run: npm run lint -w max-cultural-app --if-present
        continue-on-error: true
      - name: ESLint Origem
        run: npm run lint -w max-origem --if-present
        continue-on-error: true
      - name: ESLint Fluxo
        run: npm run lint -w max-fluxo --if-present
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # `semgrep ci` não aceita --error; com configs locais use `semgrep scan`.
      - run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/javascript
          --error
          --exclude node_modules
          --exclude .next
