version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    # Prioriza patches de segurança; majors ficam isolados para review.
    groups:
      production-patch:
        dependency-type: production
        update-types:
          - patch
      production-minor:
        dependency-type: production
        update-types:
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
    cooldown:
      # Semgrep p/owasp-top-ten exige >= 7 dias (sg.run/5WvGK).
      default-days: 7
      # Security advisories do GitHub ainda abrem PR imediato fora do cooldown.
    ignore:
      # Majors quebram tooling/CI; subir só com PR manual e plano de upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
