version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    # Prioriza patches de segurança; majors ficam isolados para review.
    groups:
      production-patch:
        dependency-type: production
        update-types:
          - patch
      production-minor:
        dependency-type: production
        update-types:
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
    cooldown:
      default-days: 3
      # Security advisories do GitHub ainda abrem PR imediato fora do cooldown.
